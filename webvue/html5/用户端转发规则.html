<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miko邮箱 - 邮件转发管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --primary: #00B4D8;
            --primary-light: #90e0ef;
            --accent: #FF6B6B;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* 装饰元素 */
        .decoration {
            position: fixed;
            z-index: -1;
            opacity: 0.05;
        }
        
        .circle1 {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary), transparent);
            top: -200px;
            right: -100px;
        }
        
        .circle2 {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent), transparent);
            bottom: -150px;
            left: -100px;
        }
        
        /* 顶部导航 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo i {
            font-size: 28px;
        }
        
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        
        .search-box {
            position: relative;
        }
        
        .search-input {
            padding: 12px 20px 12px 45px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: rgba(15, 23, 42, 0.5);
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
            width: 300px;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.2);
        }
        
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 18px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px 15px;
            background-color: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        .user-name {
            font-weight: 500;
            font-size: 16px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), #0077b6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }
        
        /* 主内容容器 */
        .main-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            max-width: 1600px;
            margin: 30px auto;
            padding: 0 30px;
        }
        
        /* 侧边栏 */
        .sidebar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 25px 0;
            height: fit-content;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .welcome-card {
            padding: 0 25px 25px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        .welcome-title {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .welcome-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .nav-menu {
            list-style: none;
            padding: 0 15px;
        }
        
        .nav-item {
            margin-bottom: 8px;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .nav-item:hover {
            transform: translateX(5px);
        }
        
        .nav-link {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-link:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }
        
        .nav-link.active {
            background: linear-gradient(90deg, rgba(0, 180, 216, 0.2), transparent);
            color: var(--primary);
            font-weight: 500;
        }
        
        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background-color: var(--primary);
            border-radius: 0 4px 4px 0;
            animation: breath 1.5s infinite ease-in-out;
        }
        
        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 18px;
        }
        
        .folder-section {
            margin-top: 25px;
            padding: 0 25px;
        }
        
        .folder-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .folder-list {
            list-style: none;
        }
        
        .folder-item {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .folder-item:hover {
            background-color: var(--bg-hover);
        }
        
        .folder-name {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .folder-count {
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--info);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        
        /* 主内容区域 */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        /* 快速操作卡片 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }
        
        .action-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }
        
        .action-card:hover {
            transform: translateY(-5px);
        }
        
        .action-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), transparent);
        }
        
        .action-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 24px;
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--primary);
        }
        
        .action-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .action-value {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(to right, #f8fafc, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* 邮箱概览 */
        .mail-overview {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .mail-container {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .section-title i {
            color: var(--primary);
        }
        
        .compose-btn {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--primary), #0077b6);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 180, 216, 0.2);
        }
        
        .compose-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 180, 216, 0.3);
        }
        
        /* 邮件表格 */
        .mail-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .mail-table th {
            background-color: rgba(15, 23, 42, 0.7);
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 16px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }
        
        .mail-table td {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            font-size: 16px;
        }
        
        .mail-table tr:last-child td {
            border-bottom: none;
        }
        
        .mail-table tr:hover {
            background-color: rgba(51, 65, 85, 0.2);
        }
        
        .sender-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .sender-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(45deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: white;
        }
        
        .mail-subject {
            font-weight: 500;
        }
        
        .mail-preview {
            color: var(--text-secondary);
            font-size: 14px;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .unread .mail-subject {
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .unread .sender-name {
            font-weight: 600;
        }
        
        .star-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        
        .star-btn:hover {
            color: var(--warning);
        }
        
        .starred {
            color: var(--warning);
        }
        
        .attachment-indicator {
            color: var(--primary);
            font-size: 14px;
        }
        
        /* 状态卡片 */
        .status-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .storage-status {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .storage-header {
            display: flex;
            justify-content: space-between;
        }
        
        .storage-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .storage-value {
            font-size: 16px;
            color: var(--text-secondary);
        }
        
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: rgba(15, 23, 42, 0.5);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            width: 65%;
        }
        
        .security-status {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        
        .security-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .security-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .security-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background-color: rgba(16, 185, 129, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--success);
        }
        
        .security-name {
            font-weight: 500;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 34px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: var(--primary);
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        /* 转发管理特定样式 */
        .forwarding-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .stat-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--primary);
        }
        
        .stat-title {
            font-size: 16px;
            color: var(--text-secondary);
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-left: 52px;
        }
        
        .stat-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            display: inline-block;
        }
        
        .status-active {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }
        
        .status-inactive {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        
        .forwarding-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .forwarding-table th {
            background-color: rgba(15, 23, 42, 0.7);
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 16px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }
        
        .forwarding-table td {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            font-size: 16px;
        }
        
        .forwarding-table tr:last-child td {
            border-bottom: none;
        }
        
        .forwarding-table tr:hover {
            background-color: rgba(51, 65, 85, 0.2);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            border: 2px dashed var(--border);
            border-radius: 12px;
            margin-top: 30px;
            background-color: rgba(15, 23, 42, 0.3);
        }
        
        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            color: var(--primary);
            opacity: 0.5;
        }
        
        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--text-primary);
        }
        
        .empty-state p {
            margin-bottom: 20px;
        }
        
        .btn-outline {
            padding: 10px 25px;
            border-radius: 8px;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-outline:hover {
            background-color: rgba(0, 180, 216, 0.1);
        }
        
        .action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            border-radius: 5px;
            transition: all 0.2s ease;
        }
        
        .action-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .edit-btn:hover {
            color: var(--primary);
        }
        
        .delete-btn:hover {
            color: var(--accent);
        }
        
        /* 动画效果 */
        @keyframes breath {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 180, 216, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 180, 216, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 180, 216, 0); }
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            .top-nav {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
            
            .search-box {
                width: 100%;
            }
            
            .search-input {
                width: 100%;
            }
            
            .quick-actions {
                grid-template-columns: 1fr;
            }
            
            .logo {
                font-size: 20px;
            }
            
            .forwarding-stats {
                grid-template-columns: 1fr;
            }
            
            .forwarding-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <!-- 装饰元素 -->
    <div class="decoration circle1"></div>
    <div class="decoration circle2"></div>
    
    <!-- 顶部导航 -->
    <nav class="top-nav">
        <div class="logo">
            <i class="fas fa-envelope"></i>
            <span>Miko邮箱</span>
        </div>
        
        <div class="nav-controls">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" placeholder="搜索邮件...">
            </div>
            
            <div class="user-info">
                <div class="user-name">admin@company.com</div>
                <div class="user-avatar">A</div>
            </div>
        </div>
    </nav>
    
    <!-- 主内容容器 -->
    <div class="main-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="welcome-card">
                <h2 class="welcome-title">欢迎回来，XXX</h2>
                <p class="welcome-subtitle">上次登录：今天 09:45 从北京</p>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <div class="nav-icon">
                            <i class="fas fa-inbox"></i>
                        </div>
                        <span class="nav-text">收件箱</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <div class="nav-icon">
                            <i class="fas fa-paper-plane"></i>
                        </div>
                        <span class="nav-text">已发送</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <div class="nav-icon">
                            <i class="fas fa-file-alt"></i>
                        </div>
                        <span class="nav-text">草稿箱</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <div class="nav-icon">
                            <i class="fas fa-trash-alt"></i>
                        </div>
                        <span class="nav-text">垃圾邮件</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <div class="nav-icon">
                            <i class="fas fa-star"></i>
