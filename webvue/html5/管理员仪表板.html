<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miko邮箱系统 - 管理员面板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --primary: #00B4D8;
            --primary-light: #90e0ef;
            --accent: #FF6B6B;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }
        
        /* 侧边导航 */
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 25px 0;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .sidebar-header {
            padding: 0 25px 25px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        .sidebar-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .nav-menu {
            list-style: none;
            padding: 0 15px;
        }
        
        .nav-item {
            margin-bottom: 8px;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .nav-item:hover {
            transform: translateX(5px);
        }
        
        .nav-link {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-link:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }
        
        .nav-link.active {
            background: linear-gradient(90deg, rgba(0, 180, 216, 0.2), transparent);
            color: var(--primary);
            font-weight: 500;
        }
        
        .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background-color: var(--primary);
            border-radius: 0 4px 4px 0;
            animation: breath 1.5s infinite ease-in-out;
        }
        
        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 18px;
        }
        
        /* 主内容区域 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px;
        }
        
        /* 顶部栏 */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .page-title {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .page-title i {
            color: var(--primary);
            font-size: 24px;
        }
        
        .admin-info {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px 15px;
            background-color: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        .admin-name {
            font-weight: 500;
            font-size: 16px;
        }
        
        .admin-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), #0077b6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }
        
        /* 数据统计卡片 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), transparent);
        }
        
        .stat-title {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(to right, #f8fafc, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 500;
            color: var(--success);
            margin-top: 15px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--success);
        }
        
        /* 快速操作区域 */
        .quick-actions {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .section-title {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .section-title i {
            color: var(--primary);
        }
        
        .action-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            flex: 1;
            min-width: 200px;
            padding: 18px 25px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--primary), #0077b6);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 180, 216, 0.2);
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 180, 216, 0.3);
        }
        
        .action-btn.refresh {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
        }
        
        .action-btn.refresh:hover {
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }
        
        /* 系统信息区域 */
        .system-info {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .info-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .info-table tr {
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }
        
        .info-table tr:last-child {
            border-bottom: none;
        }
        
        .info-table td {
            padding: 18px 15px;
            font-size: 16px;
        }
        
        .info-table td:first-child {
            color: var(--text-secondary);
            width: 30%;
            font-weight: 500;
        }
        
        .info-table td:last-child {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status-normal {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }
        
        .status-running {
            background-color: rgba(0, 180, 216, 0.15);
            color: var(--primary);
        }
        
        /* 动画效果 */
        @keyframes breath {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* 响应式设计 */
        @media (max-width: 992px) {
            .sidebar {
                width: 80px;
            }
            .sidebar-title, .nav-text {
                display: none;
            }
            .sidebar-header {
                padding: 0 15px 20px;
                text-align: center;
            }
            .nav-link {
                justify-content: center;
                padding: 15px;
            }
            .nav-icon {
                margin-right: 0;
                font-size: 20px;
            }
            .action-buttons {
                flex-direction: column;
            }
        }
        
        @media (max-width: 768px) {
            .stats-container {
                grid-template-columns: 1fr;
            }
            .topbar {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
            .page-title {
                font-size: 24px;
            }
            .admin-info {
                width: 100%;
                justify-content: center;
            }
        }
        
        /* 浮动动画 */
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        /* 装饰元素 */
        .decoration {
            position: fixed;
            z-index: -1;
            opacity: 0.05;
        }
        
        .circle1 {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary), transparent);
            top: -200px;
            right: -100px;
        }
        
        .circle2 {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent), transparent);
            bottom: -150px;
            left: -100px;
        }
    </style>
</head>
<body>
    <!-- 装饰元素 -->
    <div class="decoration circle1"></div>
    <div class="decoration circle2"></div>
    
    <!-- 侧边导航 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">管理员面板</h2>
        </div>
        
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="#" class="nav-link active">
                    <div class="nav-icon">
                        <i class="fas fa-tachometer-alt"></i>
                    </div>
                    <span class="nav-text">仪表板</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <div class="nav-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <span class="nav-text">用户管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <div class="nav-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <span class="nav-text">邮箱管理</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <div class="nav-icon">
                        <i class="fas fa-globe"></i>
                    </div>
                    <span class="nav-text">域名管理</span>
                </a>
            </li>
        </ul>
    </aside>
    
    <!-- 主内容区域 -->
    <main class="main-content">
        <!-- 顶部栏 -->
        <header class="topbar">
            <div class="page-title">
                <i class="fas fa-tachometer-alt"></i>
                <span>管理员仪表板</span>
            </div>
            
            <div class="admin-info">
                <div class="admin-name">管理员</div>
                <div class="admin-avatar">A</div>
            </div>
        </header>
        
        <!-- 数据统计卡片 -->
        <div class="stats-container">
            <div class="stat-card floating">
                <div class="stat-title">
                    <i class="fas fa-users"></i>
                    <span>总用户数</span>
                </div>
                <div class="stat-value">0</div>
                <div class="stat-status">
                    <span class="status-dot"></span>
                    <span>今日新增: 0</span>
                </div>
            </div>
            
            <div class="stat-card floating" style="animation-delay: 0.2s;">
                <div class="stat-title">
                    <i class="fas fa-globe-asia"></i>
                    <span>总域名数</span>
                </div>
                <div class="stat-value">0</div>
                <div class="stat-status">
                    <span class="status-dot"></span>
                    <span>今日新增: 0</span>
                </div>
            </div>
            
            <div class="stat-card floating" style="animation-delay: 0.4s;">
                <div class="stat-title">
                    <i class="fas fa-check-circle"></i>
                    <span>已验证域名</span>
                </div>
                <div class="stat-value">0</div>
                <div class="stat-status">
                    <span class="status-dot"></span>
                    <span>待验证: 0</span>
                </div>
            </div>
            
            <div class="stat-card floating" style="animation-delay: 0.6s;">
                <div class="stat-title">
                    <i class="fas fa-server"></i>
                    <span>系统状态</span>
                </div>
                <div class="stat-value">正常</div>
                <div class="stat-status">
                    <span class="status-dot" style="background-color: var(--success);"></span>
                    <span>运行中</span>
                </div>
            </div>
        </div>
        
        <!-- 快速操作区域 -->
        <div class="quick-actions">
            <div class="section-header">
                <h3 class="section-title">
                    <i class="fas fa-bolt"></i>
                    <span>快速操作</span>
                </h3>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn">
                    <i class="fas fa-globe"></i>
                    管理域名
                </button>
                
                <button class="action-btn">
                    <i class="fas fa-users"></i>
                    管理用户
                </button>
                
                <button class="action-btn refresh">
                    <i class="fas fa-sync-alt"></i>
                    刷新统计
                </button>
            </div>
        </div>
        
        <!-- 系统信息区域 -->
        <div class="system-info">
            <div class="section-header">
                <h3 class="section-title">
                    <i class="fas fa-info-circle"></i>
                    <span>系统信息</span>
                </h3>
            </div>
            
            <table class="info-table">
                <tr>
                    <td>系统版本</td>
                    <td>Miko邮箱系统 V1.0</td>
                </tr>
                <tr>
                    <td>运行状态</td>
                    <td>
                        <span class="status-badge status-normal">正常运行</span>
                    </td>
                </tr>
                <tr>
                    <td>SMTP服务</td>
                    <td>
                        <span class="status-badge status-running">端口 23：启可信</span>
                    </td>
                </tr>
                <tr>
                    <td>IMAP服务</td>
                    <td>
                        <span class="status-badge status-running">端口 143：运行中</span>
                    </td>
                </tr>
                <tr>
                    <td>POP3服务</td>
                    <td>
                        <span class="status-badge status-running">端口 110：运行中</span>
                    </td>
                </tr>
                <tr>
                    <td>Web服务</td>
                    <td>
                        <span class="status-badge status-running">端口 8080：启可信</span>
                    </td>
                </tr>
            </table>
        </div>
    </main>
    
    <script>
        // 切换导航活动状态
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.nav-link').forEach(item => {
                    item.classList.remove('active');
                });
                this.classList.add('active');
                
                // 更新页面标题
                const pageName = this.querySelector('.nav-text').textContent;
                document.querySelector('.page-title span').textContent = `管理员${pageName}`;
            });
        });
        
        // 添加浮动动画延迟
        document.querySelectorAll('.floating').forEach((card, index) => {
            card.style.animationDelay = `${index * 0.2}s`;
        });
        
        // 按钮点击动画
        document.querySelectorAll('.action-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
                
                if(this.classList.contains('refresh')) {
                    // 模拟刷新统计
                    const cards = document.querySelectorAll('.stat-card');
                    cards.forEach(card => {
                        card.style.animation = 'pulse 0.5s ease';
                        setTimeout(() => {
                            card.style.animation = '';
                        }, 500);
                    });
                }
            });
        });
    </script>
</body>
</html>
